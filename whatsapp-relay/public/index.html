<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Relay</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#25D366">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 12px; padding: 10px 14px; border: 0; border-radius: 8px;
             background: #25D366; color: #fff; font-weight: 600; cursor: pointer; }
    .hidden { display: none; }
    #qr { width: 260px; max-width: 100%; }
    .msg { font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <section id="login" class="card hidden">
    <h2>Entrar</h2>
    <label>Token de administrador
      <input id="token" type="password" autocomplete="current-password">
    </label>
    <button id="entrar">Entrar</button>
  </section>

  <section id="painel" class="card hidden">
    <h2>Conexão</h2>
    <p>Status: <strong id="conexao">—</strong></p>
    <img id="qr" class="hidden" alt="QR code">
    <p class="msg" id="dica"></p>
    <p class="msg">Fila: <span id="fila">0</span> · Último envio: <span id="ultimo">—</span></p>
    <button id="resetar">Resetar sessão do WhatsApp</button>
  </section>

  <section id="config-card" class="card hidden">
    <h2>Configuração</h2>
    <form id="form-config">
      <label>JID do Grupo A (origem)<input name="grupoAJid" required></label>
      <label>JID do Grupo B (destino)<input name="grupoBJid" required></label>
      <label>URL que substitui os links<input name="url" type="url" required></label>
      <label>Intervalo (minutos)<input name="intervaloMin" type="number" min="1" required></label>
      <button type="submit">Salvar</button>
      <p class="msg" id="msg-config"></p>
    </form>
  </section>

  <script src="app.js"></script>
</body>
</html>
